name: Publish to npm

# Runs on every push to main.
# Publishes only when package.json contains a version that doesn't exist on npm.
# After publishing, creates a Git tag for that version.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing requires a recent npm version.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish if version is new
        id: publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "Package: $NAME"
          echo "Version: $VERSION"

          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)

          if [ -n "$PUBLISHED" ]; then
            echo "$NAME@$VERSION is already published — skipping publish."
          else
            echo "Publishing $NAME@$VERSION..."
            npm publish --access public
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping."
          else
            echo "Creating tag $VERSION..."
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
